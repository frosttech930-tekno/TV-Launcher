<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Projector">
<meta name="theme-color" content="#0b0b10">
<title>Projector Remote</title>
<style>
  :root {
    --bg: #0b0b10;
    --surface: #17171f;
    --surface-press: #2a2a36;
    --line: rgba(255, 255, 255, 0.1);
    --ink: #f2f2f5;
    --ink-2: rgba(242, 242, 245, 0.6);
    --good: #3ddc84;
    --warn: #ffb74d;
    --bad: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body {
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 22px; align-items: center;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  header { width: 100%; max-width: 380px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); text-align: right; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.good { background: var(--good); }
  .dot.bad { background: var(--bad); }

  button {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; cursor: pointer; touch-action: manipulation;
    display: grid; place-items: center; transition: background 0.08s, transform 0.08s;
  }
  button.pressed, button:active { background: var(--surface-press); transform: scale(0.96); }
  button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .dpad { position: relative; width: min(78vw, 300px); aspect-ratio: 1; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); }
  .dpad button { position: absolute; background: transparent; border: 0; border-radius: 0; }
  .dpad button.pressed { background: rgba(255, 255, 255, 0.07); }
  .dpad .up { left: 30%; right: 30%; top: 0; height: 30%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .dpad .down { left: 30%; right: 30%; bottom: 0; height: 30%; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
  .dpad .left { top: 30%; bottom: 30%; left: 0; width: 30%; border-radius: 50% 0 0 50% / 100% 0 0 100%; }
  .dpad .right { top: 30%; bottom: 30%; right: 0; width: 30%; border-radius: 0 50% 50% 0 / 0 100% 100% 0; }
  .dpad .ok {
    left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%;
    background: #23232d; border: 1px solid var(--line); font-weight: 600; font-size: 18px;
  }
  .dpad .ok.pressed { background: var(--surface-press); }

  .row { width: 100%; max-width: 380px; display: grid; gap: 12px; }
  .row.three { grid-template-columns: repeat(3, 1fr); }
  .row.four { grid-template-columns: repeat(4, 1fr); }
  .row button { height: 58px; }
  .row .label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
  .row .label svg { color: var(--ink); }

  .keyboard { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
  .keyboard label { font-size: 13px; color: var(--ink-2); }
  .keyboard input {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; -webkit-user-select: text; user-select: text;
  }
  .keyboard input:focus { outline: 2px solid rgba(255, 255, 255, 0.35); outline-offset: 1px; }
  .keyboard .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  .keyboard .actions button { height: 48px; border-radius: 12px; background: #23232d; font-size: 15px; }
  .keyboard .send { background: var(--ink) !important; color: var(--bg); font-weight: 600; }

  .pin { position: fixed; inset: 0; background: rgba(5, 5, 8, 0.92); display: grid; place-items: center; padding: 24px; }
  .pin[hidden] { display: none; }
  .pin form { width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .pin h2 { margin: 0; font-size: 19px; }
  .pin p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.45; }
  .pin input { font: inherit; font-size: 28px; letter-spacing: 0.3em; text-align: center; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .pin button { height: 50px; background: var(--ink); color: var(--bg); font-weight: 600; border-radius: 14px; }

  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <header>
    <h1>Projector</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  </header>

  <div class="dpad">
    <button class="up" data-key="up" data-repeat aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="left" data-key="left" data-repeat aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="ok" data-key="ok">OK</button>
    <button class="right" data-key="right" data-repeat aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="down" data-key="down" data-repeat aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div class="row three">
    <button class="label" data-key="back"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Back</button>
    <button class="label" data-key="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="label" data-key="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
  </div>

  <div class="row four">
    <button data-key="voldown" data-repeat aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4"/></svg></button>
    <button data-key="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></button>
    <button data-key="volup" data-repeat aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4M19 10v4"/></svg></button>
    <button data-key="playpause" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M6 5v14l8-7z"/><path d="M17 5v14M21 5v14"/></svg></button>
  </div>

  <form class="keyboard" id="keyboard" autocomplete="off">
    <label for="text">Type on the projector</label>
    <input id="text" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Select a text box on the projector first">
    <div class="actions">
      <button class="send" type="submit">Send text</button>
      <button type="button" data-key="delete" data-repeat aria-label="Delete">⌫</button>
      <button type="button" data-key="enter">Enter</button>
    </div>
  </form>

  <div class="pin" id="pinScreen" hidden>
    <form id="pinForm">
      <h2>Enter the PIN</h2>
      <p>On the projector, open More → Phone remote. The 4-digit PIN is under the QR code.</p>
      <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN">
      <button type="submit">Connect</button>
    </form>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let pin = params.get("pin") || "";
  try { if (pin) localStorage.setItem("pin", pin); else pin = localStorage.getItem("pin") || ""; } catch (e) {}

  function setStatus(text, kind) {
    $("status").textContent = text;
    $("dot").className = "dot" + (kind ? " " + kind : "");
  }
  function showPin() {
    $("pinScreen").hidden = false;
    $("pinInput").focus();
  }

  async function call(path, body) {
    if (!pin) { showPin(); return; }
    try {
      const res = await fetch(path, { method: "POST", headers: { "X-Pin": pin, "Content-Type": "text/plain;charset=utf-8" }, body: body || "" });
      const data = await res.json().catch(() => ({}));
      if (res.status === 403) { setStatus("Wrong PIN", "bad"); showPin(); return; }
      const text = data.status || "Ready";
      setStatus(text, text === "Connected" ? "good" : (res.ok ? "" : "bad"));
    } catch (e) {
      setStatus("Can't reach the projector. Is it on the same Wi-Fi?", "bad");
    }
  }
  const press = (key) => call("/api/key?k=" + encodeURIComponent(key));

  // Tap sends once; holding arrows, volume and delete repeats like a real remote.
  document.querySelectorAll("[data-key]").forEach((btn) => {
    let delay, repeat;
    const stop = () => { clearTimeout(delay); clearInterval(repeat); btn.classList.remove("pressed"); };
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      btn.classList.add("pressed");
      press(btn.dataset.key);
      if (btn.hasAttribute("data-repeat")) {
        delay = setTimeout(() => { repeat = setInterval(() => press(btn.dataset.key), 140); }, 450);
      }
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach((t) => btn.addEventListener(t, stop));
    btn.addEventListener("click", (e) => e.preventDefault());
  });

  $("keyboard").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value;
    if (!text) return;
    call("/api/text", text);
    $("text").value = "";
  });

  $("pinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    pin = $("pinInput").value.trim();
    try { localStorage.setItem("pin", pin); } catch (err) {}
    $("pinScreen").hidden = true;
    call("/api/status");
  });

  call("/api/status");
  setInterval(() => { if (!document.hidden) call("/api/status"); }, 4000);
})();
</script>
</body>
</html>
